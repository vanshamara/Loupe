<svg xmlns="http://www.w3.org/2000/svg" width="980" height="580" viewBox="0 0 980 580">
<style>.title { font: 700 24px system-ui, sans-serif; fill: #0f172a; }.subtitle { font: 14px system-ui, sans-serif; fill: #475569; }.label { font: 12px system-ui, sans-serif; fill: #334155; }.cell-label { font: 12px system-ui, sans-serif; fill: #0f172a; }.axis { stroke: #475569; stroke-width: 1.5; }.axis-label { font: 13px system-ui, sans-serif; fill: #334155; }</style>
