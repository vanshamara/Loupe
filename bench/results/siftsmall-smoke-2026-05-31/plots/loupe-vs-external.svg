<svg xmlns="http://www.w3.org/2000/svg" width="980" height="580" viewBox="0 0 980 580">
<style>.title { font: 700 24px system-ui, sans-serif; fill: #0f172a; }.subtitle { font: 14px system-ui, sans-serif; fill: #475569; }.label { font: 12px system-ui, sans-serif; fill: #334155; }.cell-label { font: 12px system-ui, sans-serif; fill: #0f172a; }.axis { stroke: #475569; stroke-width: 1.5; }.axis-label { font: 13px system-ui, sans-serif; fill: #334155; }</style>
<rect width="100%" height="100%" fill="#ffffff" />
<text x="120" y="34" class="title">Loupe Planner vs External Engines</text>
<text x="120" y="56" class="subtitle">higher is better on recall; lower is better on latency</text>
<line x1="120" y1="490" x2="930" y2="490" class="axis" />
<line x1="120" y1="490" x2="120" y2="70" class="axis" />
<text x="420.0" y="560.0" class="axis-label">mean latency (us)</text>
<text x="20" y="380.0" class="axis-label" transform="rotate(-90 20,380.0)">mean recall</text>
<circle cx="170.7" cy="72.1" r="8" fill="#0f172a" />
<text x="182.7" y="76.1" class="label">Loupe Planner (0.995)</text>
<circle cx="149.2" cy="229.0" r="8" fill="#dc2626" />
<text x="161.2" y="233.0" class="label">FAISS (0.621)</text>
<circle cx="291.1" cy="70.1" r="8" fill="#2563eb" />
<text x="303.1" y="74.1" class="label">Qdrant (1.000)</text>
<circle cx="282.6" cy="70.0" r="8" fill="#16a34a" />
<text x="294.6" y="74.0" class="label">pgvector (1.000)</text>
<circle cx="930.0" cy="70.0" r="8" fill="#7c3aed" />
<text x="942.0" y="74.0" class="label">Weaviate (1.000)</text>
</svg>
