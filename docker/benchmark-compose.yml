services:
  qdrant:
    image: qdrant/qdrant:v1.18.1
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.37.6
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      DEFAULT_VECTORIZER_MODULE: none
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      CLUSTER_HOSTNAME: node1
    volumes:
      - weaviate-data:/var/lib/weaviate

  pgvector:
    image: pgvector/pgvector:0.8.2-pg18-trixie
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: loupe_bench
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_USER: loupe
    volumes:
      - pgvector18-data:/var/lib/postgresql

volumes:
  qdrant-data:
  weaviate-data:
  pgvector18-data:
